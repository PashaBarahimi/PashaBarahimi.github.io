bio: >-
  I'm a Computer Engineering PhD student at the University of Southern California,
  working on the security of networked and decentralized systems — censorship-resistant
  networking and trust-minimizing protocols. I picked up
  programming in high school and it turned into a degree — I finished my B.Sc. at the
  University of Tehran ranked first in my class. Along the way I've done model checking
  for concurrent programs at MPI-SWS, symbolic execution over Ethereum smart contracts
  at the University of Toronto, and cloud infrastructure and payments work in industry.
