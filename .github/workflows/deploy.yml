name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The CV is built and released from PashaBarahimi/CV, so it is fetched at
      # deploy time rather than committed here — the site serves the bytes from
      # its own domain, but only one copy of the PDF is ever maintained.
      # -f so a missing or renamed asset fails the deploy instead of quietly
      # publishing a dead download link.
      - name: Fetch the latest CV release
        run: >-
          curl -fsSL --retry 3 --retry-delay 2
          -o dist/cv.pdf
          https://github.com/PashaBarahimi/CV/releases/latest/download/cv.pdf

      - name: Verify it is a PDF
        run: |
          file_head=$(head -c 5 dist/cv.pdf)
          if [ "$file_head" != "%PDF-" ]; then
            echo "dist/cv.pdf is not a PDF (starts with: $file_head)" >&2
            exit 1
          fi
          ls -l dist/cv.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
